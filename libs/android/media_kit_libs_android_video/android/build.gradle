import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {   
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify their SHA-256 checksums.
        def filesToDownload = [
            ["url": "https://github.com/123seven/libmpv-android-video-build/releases/download/v1.2.4/default-arm64-v8a.jar", "sha256": "992b3fac1ee62014411c75037d8646dd3d06d88cc60448040c6438923e85c75c", "destination": file("$buildDir/v1.2.4/default-arm64-v8a.jar")],
            ["url": "https://github.com/123seven/libmpv-android-video-build/releases/download/v1.2.4/default-armeabi-v7a.jar", "sha256": "c0ce9c37b16bca8c398bd0156497a7a94c9b8d26fb36da16cbd1207f67f1fddc", "destination": file("$buildDir/v1.2.4/default-armeabi-v7a.jar")],
            ["url": "https://github.com/123seven/libmpv-android-video-build/releases/download/v1.2.4/default-x86_64.jar", "sha256": "c9de37186b8a72f5873774bfddd50268e51d4bbd0aebca835f8a59a1a3a39142", "destination": file("$buildDir/v1.2.4/default-x86_64.jar")],
            ["url": "https://github.com/123seven/libmpv-android-video-build/releases/download/v1.2.4/default-x86.jar", "sha256": "f5c9fd583138545a6ce97c8d2a645089fe2179fcee5831ab53ac5e707f82d141", "destination": file("$buildDir/v1.2.4/default-x86.jar")]
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            if (destFile.exists()) {
                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedSHA256 != fileInfo.sha256) {
                    destFile.delete()
                    println "SHA-256 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedSHA256 = MessageDigest.getInstance("SHA-256").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedSHA256 != fileInfo.sha256) {
                    throw new GradleException("SHA-256 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)